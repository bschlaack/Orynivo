<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1625"><title>Orynivo Remote</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#0b1625;color:#eef4fc;--accent:#26dae5;--muted:#a0b0c6;--line:#2b3e56}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#17334a 0,transparent 55%),#0b1625;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation;min-height:44px;padding:9px 15px;border-radius:12px;border:1px solid var(--line);background:#20334a;color:inherit}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}input,select{width:100%;min-width:0;background:#0c1929;border:1px solid var(--line);border-radius:12px;color:inherit;padding:12px;font-size:16px}input[type=range]{padding:0;accent-color:var(--accent);border:0;min-height:44px;cursor:pointer}label{color:var(--muted);font-size:.85rem}.primary{background:var(--accent);color:#06212b;border-color:var(--accent);font-weight:700}
main{max-width:1080px;margin:auto;padding:24px max(18px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}header{display:flex;align-items:center;justify-content:space-between;margin:0 0 26px;gap:16px}.brand{font-size:1.35rem;font-weight:750;letter-spacing:-.04em;color:var(--accent)}.brand span{color:var(--muted);font-size:.85rem;letter-spacing:.06em;margin-left:8px;font-weight:400}.card{background:linear-gradient(135deg,#17283c,#111f31);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 18px 60px #0003}#login{max-width:460px;margin:7vh auto;display:grid;gap:14px}h1,h2,p{margin:0}h1{font-size:1.7rem}h2{font-size:1.25rem}.muted,.meta{color:var(--muted)}.meta{font-size:.85rem;margin-top:4px}.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}.error{color:#ffb0bf}.banner{position:sticky;top:8px;z-index:3;background:#253349;border-radius:12px;padding:10px 16px;margin-bottom:12px}.hero{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,1fr);gap:32px;align-items:center}.artwork{aspect-ratio:1;border-radius:18px;overflow:hidden;background:linear-gradient(145deg,#285367,#4f3c70);display:grid;place-items:center;box-shadow:0 14px 34px #0005}.artwork img{width:100%;height:100%;object-fit:contain;grid-area:1/1}.artwork svg{width:30%;height:30%;color:#c6e6ee;grid-area:1/1}.track-title{font-size:clamp(1.5rem,3vw,2.3rem);font-weight:750;line-height:1.2;overflow-wrap:anywhere}.artist{font-size:1.1rem;margin-top:10px}.album{margin:3px 0 15px}.controls{display:flex;gap:12px;justify-content:center;align-items:center;margin:14px 0 22px}.controls button{width:52px;height:52px;padding:13px;border-radius:50%}.controls .primary{width:68px;height:68px;padding:20px}.icon{width:24px;height:24px;display:block;fill:currentColor}.time,.section-head,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.time{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}.favorite{padding:6px 10px;margin:12px 0 4px}.favorite[aria-pressed=true]{color:#ff7f9f}.output{border-top:1px solid var(--line);padding-top:16px;margin-top:12px}.section-head{margin:0 0 18px;flex-wrap:wrap}.searchbar{display:flex;gap:8px;margin:16px 0}.list{list-style:none;margin:0;padding:0}.list li{border-bottom:1px solid var(--line);padding:14px 0}.row-name{background:none;border:0;text-align:left;padding:0;min-width:0;flex:1;overflow-wrap:anywhere;font-weight:650}.row-title{overflow-wrap:anywhere}.badge{color:var(--accent);font-size:.8rem;padding:4px 9px;border:1px solid var(--line);border-radius:20px;white-space:nowrap}.result-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.result-actions button{font-size:.8rem;min-height:44px;padding:7px 12px}.active{border-left:3px solid var(--accent);padding-left:12px!important;background:#1b35414d}.empty{color:var(--muted);padding:36px 8px;text-align:center}.tabs{display:flex;gap:8px;padding:8px;background:#101f31;border:1px solid var(--line);border-radius:18px;margin-bottom:22px}.tabs button{flex:1;background:transparent;border:0;font-size:.9rem}.tabs button[aria-pressed=true]{background:#244052;color:var(--accent)}.count{color:var(--muted);font-weight:400;font-size:.9rem}#logout{background:transparent;font-size:.8rem}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:700px){main{padding-top:max(18px,env(safe-area-inset-top))}.hero{grid-template-columns:1fr;gap:22px}.artwork{width:min(100%,330px);margin:auto}.card{padding:20px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;border-radius:18px 18px 0 0;margin:0;padding-bottom:max(8px,env(safe-area-inset-bottom));box-shadow:0 -8px 28px #0005}.tabs button{padding:9px 4px;font-size:.78rem}.track-title{font-size:1.6rem}.searchbar{flex-wrap:wrap}.searchbar input{flex:1;min-width:170px}.section-head{gap:8px}.brand{font-size:1.2rem}}
@media(max-width:700px){.artwork{width:min(100%,250px,32svh)}header{margin-bottom:18px}.hero{gap:18px}.controls{margin:10px 0 16px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}.card{animation:appear .2s ease-out}@keyframes appear{from{opacity:.65;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style></head><body><main>
<header><div class="brand">Orynivo<span>REMOTE</span></div><button id="logout" data-i18n="logout" hidden></button></header>
<div id="message" class="banner" role="status" aria-live="polite" hidden></div>
<form id="login" class="card"><p class="eyebrow" data-i18n="welcome"></p><h1 data-i18n="connect"></h1><p class="muted" data-i18n="loginHint"></p><label for="token" data-i18n="token"></label><input id="token" type="password" autocomplete="current-password" maxlength="512"><button class="primary" id="connect" data-i18n="connect"></button><p id="authError" class="error" role="alert"></p></form>
<div id="app" hidden>
<nav class="tabs"><button data-view="playing" data-i18n="now" aria-pressed="true"></button><button data-view="library" data-i18n="library" aria-pressed="false"></button><button data-view="playlists" data-i18n="playlists" aria-pressed="false"></button><button data-view="queue" data-i18n="queue" aria-pressed="false"></button></nav>
<section id="playing" class="card hero" data-panel>
<div class="artwork"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 3v12.2a4 4 0 1 0 2 3.5V7l9-2v8.2a4 4 0 1 0 2 3.5V1z"/></svg><img id="cover" alt="" hidden></div>
<div><p id="status" class="eyebrow"></p><h1 id="trackTitle" class="track-title"></h1><p id="artist" class="artist"></p><p id="album" class="album muted"></p><button id="favorite" class="favorite" aria-pressed="false"></button>
<label class="sr-only" for="seek" data-i18n="position"></label><input id="seek" type="range" min="0" max="1" step="1"><div class="time"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
<div class="controls"><button data-cmd="previous"></button><button class="primary" data-cmd="pause-resume"></button><button data-cmd="next"></button><button data-cmd="stop"></button></div>
<div class="row"><label for="volume" data-i18n="volume"></label><span class="count" id="volumeValue"></span></div><input id="volume" type="range" min="0" max="1" step="0.01">
<div class="output"><label for="output" data-i18n="output"></label><select id="output"></select></div></div></section>
<section id="library" class="card" data-panel hidden><h2 data-i18n="library"></h2><form id="searchForm" class="searchbar"><label class="sr-only" for="search" data-i18n="search"></label><input id="search" type="search" minlength="2" maxlength="250"><button data-i18n="search"></button></form><ul id="results" class="list"></ul><div class="section-head"><h2 id="libraryTitle"></h2><button id="libraryBack" data-i18n="back" hidden></button></div><label class="sr-only" for="libraryFilter" data-i18n="filter"></label><input id="libraryFilter" type="search" maxlength="250"><ul id="libraryList" class="list"></ul></section>
<section id="playlists" class="card" data-panel hidden><div class="section-head"><h2 id="playlistTitle" data-i18n="playlists"></h2><button id="playlistBack" data-i18n="back" hidden></button><button id="playlistRefresh" data-i18n="refresh"></button></div><p class="muted" data-i18n="playlistHint"></p><div id="playlistActions" class="result-actions" hidden><button id="playlistPlay" class="primary" data-i18n="playAll"></button><button id="playlistAppend" data-i18n="appendAll"></button></div><ul id="playlistList" class="list"></ul></section>
<section id="queue" class="card" data-panel hidden><div class="section-head"><h2><span data-i18n="queue"></span> <span id="queueCount" class="count"></span></h2><button id="clear" data-i18n="clear"></button></div><ol id="queueList" class="list"></ol></section>
</div></main><script>/*REMOTE_WORDS*/
/*REMOTE_SCRIPT*/</script></body></html>
