version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(nuget)"
    ignore:
      # Major upgrades need a deliberate migration instead of an automatic bump.
      # Avalonia 12 requires the .NET 9 SDK (Roslyn 4.14) and has breaking API
      # changes, while the desktop app targets net8.0; the Microsoft.* 9/10 and
      # test-SDK 18 lines likewise target newer runtimes. Keep Dependabot on the
      # minor/patch line and review majors by hand.
      #
      # Avalonia minor updates within 11.3 are allowed: the drag-and-drop code
      # uses IDataTransfer/DataTransfer/DragDrop.DoDragDropAsync, so the 11.3
      # deprecations no longer fail the --warnaserror build. Note that
      # Avalonia.Controls.DataGrid has no release beyond 11.3.13, so it stays on
      # that version while the other Avalonia packages may move within 11.3.x;
      # that mix builds, but do not raise DataGrid past 11.3.13.
      - dependency-name: "Avalonia*"
        update-types:
          - "version-update:semver-major"
      # SkiaSharp is pinned to the 2.88 line because Avalonia.Skia 11.3 depends on
      # SkiaSharp 2.88.9 and SkiaSharp.NativeAssets.Linux 2.88.9. Raising
      # SkiaSharp (or SkiaSharp.NativeAssets.*) in Orynivo.Core/Orynivo.Server
      # would force the desktop app to render through an incompatible
      # managed/native Skia, and 3.x/4.x also removed APIs such as
      # SKFilterQuality. Revisit when Avalonia ships a SkiaSharp 3/4-based release.
      - dependency-name: "SkiaSharp*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.Data.Sqlite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.NET.Test.Sdk"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(actions)"
