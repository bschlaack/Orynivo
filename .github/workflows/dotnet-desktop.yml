name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.configuration }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Orynivo/Orynivo.csproj

      - name: Build cwASIO bridge
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msbuild = Join-Path $installation.Trim() 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          & $msbuild Native/CwAsioBridge/CwAsioBridge.vcxproj /p:Configuration=${{ matrix.configuration }} /p:Platform=x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test AirPlay 2 bridge
        shell: pwsh
        run: |
          cmake -S Native/AirPlay2Bridge -B artifacts/AirPlay2Bridge -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build artifacts/AirPlay2Bridge --config ${{ matrix.configuration }} --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir artifacts/AirPlay2Bridge -C ${{ matrix.configuration }} --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build application
        run: >
          dotnet build Orynivo/Orynivo.csproj
          --configuration ${{ matrix.configuration }}
          --no-restore
          --warnaserror
          /p:IncludeAsioBridge=false
          /p:IncludeCwAsioBridge=true
          /p:IncludeAirPlay2Bridge=true

      - name: Publish Windows build
        if: matrix.configuration == 'Release'
        run: >
          dotnet publish Orynivo/Orynivo.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output artifacts/Orynivo-win-x64
          /p:IncludeAsioBridge=false
          /p:IncludeCwAsioBridge=true
          /p:IncludeAirPlay2Bridge=true

      - name: Upload Windows build
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v6
        with:
          name: Orynivo-win-x64
          path: artifacts/Orynivo-win-x64
          if-no-files-found: error

  linux:
    name: Build Linux desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore Linux desktop
        run: dotnet restore Orynivo/Orynivo.csproj --runtime linux-x64

      - name: Build Linux desktop
        run: >
          dotnet build Orynivo/Orynivo.csproj
          --configuration Release
          --no-restore
          --warnaserror

      - name: Publish Linux desktop
        run: >
          dotnet publish Orynivo/Orynivo.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --no-restore
          --output artifacts/Orynivo-linux-x64

      - name: Upload Linux desktop
        uses: actions/upload-artifact@v6
        with:
          name: Orynivo-linux-x64
          path: artifacts/Orynivo-linux-x64
          if-no-files-found: error

  macos:
    name: Build macOS desktop ${{ matrix.rid }}
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        rid:
          - osx-x64
          - osx-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore macOS desktop
        run: dotnet restore Orynivo/Orynivo.csproj --runtime ${{ matrix.rid }}

      - name: Build macOS desktop
        run: >
          dotnet build Orynivo/Orynivo.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --no-restore
          --warnaserror

      - name: Publish macOS desktop
        run: >
          dotnet publish Orynivo/Orynivo.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --no-restore
          --output artifacts/Orynivo-${{ matrix.rid }}

      - name: Upload macOS desktop
        uses: actions/upload-artifact@v6
        with:
          name: Orynivo-${{ matrix.rid }}
          path: artifacts/Orynivo-${{ matrix.rid }}
          if-no-files-found: error
